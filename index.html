
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modo Claro e Escuro</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: 0.3s;
    }

    body.dark {
      background: #121212;
      color: #fff;
    }

    .container {
      text-align: center;
    }

    h1 {
      margin-bottom: 20px;
    }

    /* Botão */
    .theme-button {
      width: 70px;
      height: 36px;
      border: none;
      border-radius: 50px;
      background: #222;
      padding: 4px;
      cursor: pointer;
      transition: 0.3s;
    }

    /* Bolinha */
    .theme-button::before {
      content: "☀️";
      display: flex;
      justify-content: center;
      align-items: center;

      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: white;

      transition: 0.3s;
    }

    /* Estado escuro */
    body.dark .theme-button {
      background: #ddd;
    }

    body.dark .theme-button::before {
      content: "🌙";
      transform: translateX(34px);
      background: #222;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Meu site</h1>

    <button 
      class="theme-button" 
      id="themeButton"
      aria-label="Alternar modo claro e escuro">
    </button>
  </div>

  <script>
    const button = document.getElementById("themeButton");

    button.addEventListener("click", () => {
      document.body.classList.toggle("dark");
    });
  </script>

</body>
</html>
